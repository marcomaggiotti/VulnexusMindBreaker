[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mindbreaker"
version = "0.1.0"
description = "Vulnexus MindBreaker - AI security assessment engine (Phase 1)"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.27",
    "httpx>=0.27",
    "pydantic>=2.6",
    "sqlalchemy>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
mindbreaker = "mindbreaker.cli:main"

[tool.setuptools.packages.find]
include = ["mindbreaker*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
